<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>جدولي الأسبوعي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f2fb;--card:#fff;--ink:#1e1b4b;--mut:#6b6893;--acc:#5b4bdb;--done:#0e9f84;--warm:#ff9f43;--line:#e4e0f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12102b;--card:#1c1a3d;--ink:#ece9ff;--mut:#a39fd0;--acc:#8f84ff;--done:#34d3b0;--line:#2d2a5a}}
:root[data-theme="dark"]{--bg:#12102b;--card:#1c1a3d;--ink:#ece9ff;--mut:#a39fd0;--acc:#8f84ff;--done:#34d3b0;--line:#2d2a5a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{margin:0;font-size:1.7rem;font-weight:700}
.sub{color:var(--mut);margin:2px 0 0;font-size:.95rem}
#theme{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:42px;height:42px;font-size:1.1rem;cursor:pointer}
.week{margin:22px 0 18px;background:var(--card);border-radius:18px;padding:16px 18px;border:1px solid var(--line)}
.week .row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.week b{color:var(--ink);font-size:1.1rem}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(270deg,var(--acc),var(--done));border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.tab{flex:0 0 auto;min-width:78px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:8px 12px 10px;border-radius:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,background .2s}
.tab:hover{transform:translateY(-2px)}
.tab small{display:block;color:var(--mut);font-size:.72rem}
.tab::after{content:"";position:absolute;inset:auto 0 0 auto;height:4px;width:var(--p,0%);background:var(--done);transition:width .5s}
.tab[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.tab[aria-selected=true] small{color:#ffffffcc}
.tab.today::before{content:"";position:absolute;top:7px;left:7px;width:8px;height:8px;border-radius:50%;background:var(--warm)}
.hero{display:flex;align-items:center;gap:20px;margin:14px 0 18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.ring{position:relative;width:118px;height:118px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .t{stroke:var(--line)}
.ring .v{stroke:var(--acc);stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1),stroke .4s}
.ring.full .v{stroke:var(--done)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:1.45rem}
.hero h2{margin:0;font-size:1.3rem}
.hero p{margin:4px 0 10px;color:var(--mut);font-size:.92rem}
.reset{background:none;border:1px solid var(--line);color:var(--mut);font:inherit;font-size:.82rem;padding:4px 12px;border-radius:10px;cursor:pointer}
.reset:hover{color:var(--ink)}
.hero.full{animation:pulse 1s ease 1}
@keyframes pulse{40%{transform:scale(1.025);box-shadow:0 0 0 10px color-mix(in srgb,var(--done) 25%,transparent)}}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:opacity .3s,border-color .3s,transform .2s;animation:in .45s both;animation-delay:calc(var(--i)*35ms)}
@keyframes in{from{opacity:0;transform:translateX(18px)}}
li:hover{transform:translateX(-3px)}
li.now{border-color:var(--warm);box-shadow:0 0 0 3px color-mix(in srgb,var(--warm) 22%,transparent)}
.chk{flex:0 0 auto;width:30px;height:30px;border-radius:10px;border:2px solid var(--mut);display:grid;place-items:center;transition:background .25s,border-color .25s,transform .25s}
.chk svg{width:18px;height:18px}
.chk path{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .1s}
li.done .chk{background:var(--done);border-color:var(--done);transform:scale(1.1)}
li.done .chk path{stroke-dashoffset:0}
.em{font-size:1.4rem;flex:0 0 auto}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:500;position:relative;width:fit-content;max-width:100%}
.tx b::after{content:"";position:absolute;right:0;top:55%;height:2px;width:0;background:var(--mut);transition:width .35s}
li.done .tx b{color:var(--mut)}
li.done .tx b::after{width:100%}
li.done{opacity:.72}
.tm{font-size:.82rem;color:var(--mut)}
.badge{font-size:.7rem;background:var(--warm);color:#3a2300;border-radius:8px;padding:1px 8px;margin-inline-start:8px;font-weight:700}
.chk:focus-visible,.tab:focus-visible,.reset:focus-visible,#theme:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
@media (max-width:480px){.hero{flex-direction:column;text-align:center}.em{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div><h1>جدولي الأسبوعي</h1><p class="sub">علّم على كل مهمة أول ما تخلصها، وشوف تقدمك بيكبر.</p></div>
<button id="theme" aria-label="تغيير الوضع">🌓</button>
</header>
<section class="week"><div class="row"><span>تقدم الأسبوع كله</span><b id="wp">0%</b></div><div class="bar"><i id="wb"></i></div></section>
<nav class="tabs" id="tabs" role="tablist"></nav>
<section class="hero" id="hero">
<div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="v" id="rv" cx="60" cy="60" r="52"/></svg><div class="pct" id="pct">0%</div></div>
<div><h2 id="dn"></h2><p id="dc"></p><button class="reset" id="rs">إعادة اليوم من الأول</button></div>
</section>
<ul id="list"></ul>
</div>
<script>
const NAMES=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const RAW=[
`8:00|10:00|🎓|عملي نظم التشغيل
10:00|11:00|🚗|الرجوع للبيت
11:00|11:30|🎧|بودكاست تعليمي (Podcast)
11:30|12:30|🇬🇧|إنجليزي (English)
12:30|13:00|🕌|صلاة
13:00|15:00|😴|نوم
15:00|19:00|🎓|تحضير مواد الاثنين
19:00|20:00|🕌|صلاة + أكل
20:00|22:30|🔐|أمن المعلومات (Cybersecurity)
22:30|23:00|🕌|صلاة / أكل خفيف
23:00|24:30|💰|مهارة الدخل
24:30|25:00|📖|قراءة قبل النوم`,
`8:00|10:00|🎓|نظم التشغيل 1
10:00|12:00|🎓|تحليل وتصميم الخوارزميات
12:00|14:00|🎓|المتحكمات الدقيقة
14:00|15:00|🚗|الرجوع للبيت
15:00|16:00|😴|نوم
16:00|17:30|📚|مراجعة نظم التشغيل
17:30|18:00|☕|راحة
18:00|19:30|📚|مراجعة الخوارزميات
19:30|20:30|🕌|صلاة + أكل
20:30|22:00|📚|مراجعة المتحكمات الدقيقة
22:00|22:30|☕|راحة
22:30|23:30|🇬🇧|إنجليزي (English)
23:30|24:30|🔐|أمن المعلومات (Cybersecurity)
24:30|25:00|📖|قراءة + استعداد للنوم`,
`8:00|10:00|🎓|تراسل البيانات
10:00|12:00|🎓|عملي المتحكمات الدقيقة
12:00|14:00|🎓|عملي تحليل وتصميم الخوارزميات
14:00|15:00|🚗|الرجوع للبيت
15:00|16:00|😴|نوم
16:00|17:30|📚|مراجعة تراسل البيانات
17:30|18:00|☕|راحة
18:00|19:30|📚|مراجعة المتحكمات الدقيقة
19:30|20:30|🕌|صلاة + أكل
20:30|22:00|📚|مراجعة الخوارزميات
22:00|22:30|☕|راحة
22:30|23:30|🇬🇧|إنجليزي (English)
23:30|24:30|🔐|أمن المعلومات (Cybersecurity)
24:30|25:00|📖|قراءة + استعداد للنوم`,
`8:00|9:00|🎧|بودكاست تعليمي (Podcast)
9:00|10:00|🚗|الذهاب للكلية
10:00|12:00|🎓|تراسل البيانات
12:00|15:00|🎓|إشارات ونظم
15:00|16:00|🚗|الرجوع للبيت
16:00|17:00|😴|نوم
17:00|18:30|📚|مراجعة تراسل البيانات
18:30|19:30|☕|راحة
19:30|21:00|📚|مراجعة إشارات ونظم
21:00|22:00|🕌|صلاة + أكل
22:00|24:00|🌐|مذاكرة (CCNA)
24:00|24:30|😌|راحة
24:30|25:30|🇬🇧|إنجليزي (English)`,
`11:00|13:00|🌐|(CCNA)
13:00|14:00|🍽️|أكل + صلاة + راحة
14:00|15:00|🇬🇧|إنجليزي (English)
15:00|16:00|☕|راحة
16:00|18:00|📚|أي حاجة متراكمة للكلية
18:00|18:30|☕|راحة
18:30|20:30|💰|مهارة الدخل
20:30|21:00|🕌|صلاة + راحة
21:00|22:00|🍽️|أكل / راحة
22:00|24:00|🔐|أمن المعلومات (Cybersecurity)
24:00|24:30|☕|راحة
24:30|25:30|🎧|بودكاست (Podcast)
25:30|26:00|🎮|لعب أو قراءة كتاب`,
`10:00|12:00|🇬🇧|إنجليزي (English)
12:00|13:00|🕌|صلاة + أكل + راحة
13:00|14:00|🎧|بودكاست — تغيير العقلية (Podcast)
14:00|16:00|😌|راحة / وقت حر
16:00|18:00|📱|إزاي أطلع فلوس من السوشيال ميديا
18:00|18:30|☕|راحة
18:30|21:00|💰|مهارة الدخل
21:00|25:00|🎮|اعمل اللي إنت عايزه`,
`10:00|12:00|🌐|(CCNA)
12:00|13:00|🍽️|أكل + صلاة + راحة
13:00|15:00|🇬🇧|إنجليزي (English)
15:00|17:00|😌|راحة / وقت حر
17:00|19:00|🔐|أمن المعلومات (Cybersecurity)
19:00|20:00|🕌|صلاة + أكل + راحة
20:00|21:00|🎧|بودكاست (Podcast)
21:00|22:00|🍽️|أكل + راحة
22:00|24:00|💰|مهارة الدخل
24:00|24:30|☕|راحة
24:30|25:00|📋|تحضير ليوم بكرة
25:00|25:30|📖|قراءة`];
const toM=s=>{const[a,b]=s.split(":");return +a*60+ +b};
const D=RAW.map(d=>d.split("\n").map(l=>{const[s,e,em,t]=l.split("|");return{s:toM(s),e:toM(e),em,t}}));
const fm=m=>{const h=Math.floor(m/60)%24,mi=String(m%60).padStart(2,"0");return`${h%12||12}:${mi} ${h>=12?"م":"ص"}`};
const $=id=>document.getElementById(id);
let S={};const KEY="wk-sched-v1";
try{S=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){S={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const nowD=new Date();let nm=nowD.getHours()*60+nowD.getMinutes(),today=nowD.getDay();
if(nowD.getHours()<4){nm+=1440;today=(today+6)%7}
let cur=today;
const cnt=d=>D[d].filter((_,i)=>S[d+"-"+i]).length;
function tabs(){$("tabs").innerHTML=NAMES.map((n,d)=>`<button class="tab${d===today?" today":""}" role="tab" aria-selected="${d===cur}" data-d="${d}" style="--p:${Math.round(cnt(d)/D[d].length*100)}%">${n}<small>${cnt(d)}/${D[d].length}</small></button>`).join("")}
function stats(){
 const n=cnt(cur),t=D[cur].length,p=Math.round(n/t*100);
 $("rv").style.strokeDashoffset=326.7*(1-p/100);$("pct").textContent=p+"%";
 $("ring").classList.toggle("full",p===100);
 $("dn").textContent=NAMES[cur]+(cur===today?" (النهارده)":"");
 $("dc").textContent=p===100?"خلصت اليوم كله، تستاهل 🎉":`خلصت ${n} من ${t} مهمة`;
 let a=0,b=0;D.forEach((x,d)=>{a+=cnt(d);b+=x.length});
 const wp=Math.round(a/b*100);$("wb").style.width=wp+"%";$("wp").textContent=wp+"%";
 const tb=document.querySelector(`.tab[data-d="${cur}"]`);if(tb){tb.style.setProperty("--p",p+"%");tb.querySelector("small").textContent=n+"/"+t}
}
function list(){
 $("list").innerHTML=D[cur].map((x,i)=>{
  const isNow=cur===today&&nm>=x.s&&nm<x.e;
  return`<li class="${S[cur+"-"+i]?"done":""}${isNow?" now":""}" style="--i:${i}" data-i="${i}"><button class="chk" role="checkbox" aria-checked="${!!S[cur+"-"+i]}" aria-label="تم"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button><span class="em">${x.em}</span><span class="tx"><b>${x.t}</b><span class="tm"><bdi>${fm(x.s)}</bdi> – <bdi>${fm(x.e)}</bdi>${isNow?'<span class="badge">دلوقتي</span>':""}</span></span></li>`}).join("");
}
function show(d){cur=d;document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",+t.dataset.d===d));list();stats()}
$("tabs").onclick=e=>{const t=e.target.closest(".tab");if(t)show(+t.dataset.d)};
$("list").onclick=e=>{
 const li=e.target.closest("li");if(!li)return;
 const k=cur+"-"+li.dataset.i;S[k]=!S[k];if(!S[k])delete S[k];save();
 li.classList.toggle("done",!!S[k]);li.querySelector(".chk").setAttribute("aria-checked",!!S[k]);
 const full=cnt(cur)===D[cur].length;stats();
 if(full&&S[k]){const h=$("hero");h.classList.remove("full");void h.offsetWidth;h.classList.add("full")}
};
$("rs").onclick=()=>{D[cur].forEach((_,i)=>delete S[cur+"-"+i]);save();list();stats()};
$("theme").onclick=()=>{const r=document.documentElement,dk=getComputedStyle(r).getPropertyValue("--bg").trim()==="#12102b";r.dataset.theme=dk?"light":"dark"};
tabs();list();setTimeout(stats,60);
document.querySelector(".tab.today")?.scrollIntoView({inline:"center",block:"nearest"});
</script>
</body>
</html>
